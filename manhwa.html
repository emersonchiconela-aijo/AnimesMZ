<main>
   <section style="margin: 1rem 1.5rem 0;">
    <div id="carouselIsekai" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselIsekai" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselIsekai" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselIsekai" data-bs-slide-to="2"></button>
      </div>
      <div class="carousel-inner" style="border-radius:10px;overflow:hidden;">
        <div class="carousel-item active">
          <img src="img/yogiri.png" class="d-block w-100" alt="Yogiri" style="max-height:420px;object-fit:cover;">
          <div class="carousel-caption-custom">
            <h3>Yogiri Takatou</h3>
            <p>O protagonista de Instant Death — o poder de matar qualquer coisa instantaneamente.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="img/rentaro.png" class="d-block w-100" alt="Rentaro" style="max-height:420px;object-fit:cover;">
          <div class="carousel-caption-custom">
            <h3>Rentaro Aijo</h3>
            <p>Transferido para um mundo de amor sem limites.</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="img/nano.png" class="d-block w-100" alt="Nano" style="max-height:420px;object-fit:cover;">
          <div class="carousel-caption-custom">
            <h3>Nano Eiai</h3>
            <p>Uma existência única neste mundo paralelo.</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselIsekai" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselIsekai" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
